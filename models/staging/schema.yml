version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]

  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_users
    columns:
      - name: user_id
        tests: [unique, not_null]

  - name: stg_campaigns
    columns:
      - name: campaign_id
        tests: [unique, not_null]

  - name: stg_campaign_spend
    columns:
      - name: campaign_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id